<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f5f0e7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="拆拆字">
<link rel="manifest" href="./manifest.webmanifest">

<title>拆拆字 V1.1</title>

<style>
:root{
  --bg:#f5f0e7;
  --paper:#fffdf9;
  --ink:#292724;
  --muted:#91897e;
  --line:#e7ddcf;
  --accent:#df814b;
  --accent2:#efa66d;
  --good:#6f9d76;
  --bad:#c65b4b;
  --gold:#d5a43a;
  --shadow:0 16px 42px rgba(67,48,30,.1);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

body{
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}

button{
  font:inherit;
  -webkit-tap-highlight-color:transparent;
}

button:active{
  transform:scale(.98);
}

#fx{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:100;
}

.app{
  width:100%;
  max-width:540px;
  min-height:100vh;
  margin:auto;
  padding:18px 18px calc(102px + env(safe-area-inset-bottom));
  overflow:hidden;
  position:relative;
}

.app:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.23;
  background:
    radial-gradient(circle at 15% 10%,#fff 0 2px,transparent 3px),
    radial-gradient(circle at 85% 35%,#fff 0 1px,transparent 2px);
  background-size:82px 82px;
}

.screen{
  display:none;
  position:relative;
  z-index:1;
  animation:fadeIn .23s ease;
}

.screen.active{
  display:block;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:none}
}

.top{
  min-height:45px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  font-size:24px;
  font-weight:950;
  letter-spacing:3px;
}

.coins{
  padding:9px 14px;
  background:#fffdf9;
  border:1px solid var(--line);
  border-radius:99px;
  font-weight:900;
  box-shadow:0 6px 18px #0000000b;
}

.hero,.card{
  background:rgba(255,253,249,.92);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
}

.hero{
  margin-top:20px;
  padding:30px 23px 25px;
  border-radius:30px;
  position:relative;
  overflow:hidden;
  background:linear-gradient(145deg,#fffdf9,#f3e5d3);
}

.hero:after{
  content:"拆";
  position:absolute;
  right:-12px;
  top:-25px;
  font-size:175px;
  font-weight:950;
  color:#d9784510;
  transform:rotate(8deg);
}

.hero>*{
  position:relative;
  z-index:1;
}

.hello{
  font-size:14px;
  color:var(--muted);
}

h1{
  font-size:38px;
  line-height:1.13;
  margin:8px 0;
  letter-spacing:-1px;
}

.subtitle{
  color:#716a61;
}

.primary{
  width:100%;
  border:0;
  border-radius:18px;
  padding:17px;
  margin-top:21px;
  color:#fff;
  font-size:17px;
  font-weight:950;
  background:linear-gradient(180deg,#e99059,#d97845);
  box-shadow:0 10px 22px #d9784540;
}

.card{
  margin-top:15px;
  padding:20px;
  border-radius:25px;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.title{
  font-size:19px;
  font-weight:950;
}

.small{
  font-size:13px;
  color:var(--muted);
}

.progress{
  height:9px;
  margin-top:12px;
  border-radius:99px;
  overflow:hidden;
  background:#ece3d7;
}

.bar{
  height:100%;
  width:0;
  border-radius:99px;
  transition:.35s;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
}

.nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  z-index:30;
  width:100%;
  max-width:540px;
  display:flex;
  justify-content:space-around;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  background:#fffdf9ee;
  backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
}

.nav button{
  border:0;
  background:none;
  min-width:58px;
  padding:4px;
  color:#92897e;
  font-size:11px;
  font-weight:800;
}

.nav button span{
  display:block;
  font-size:23px;
  line-height:25px;
}

.nav button.active{
  color:var(--accent);
}

.back{
  width:42px;
  height:42px;
  border-radius:14px;
  border:1px solid var(--line);
  background:#fffdf9;
  font-size:28px;
  box-shadow:0 5px 14px #00000008;
}

.world{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-top:15px;
}

.levelbtn{
  aspect-ratio:1;
  border:1px solid var(--line);
  border-radius:16px;
  background:#fff;
  font-weight:950;
  color:#5f5951;
  box-shadow:0 5px 13px #00000008;
}

.levelbtn.done{
  color:#fff;
  border:0;
  background:linear-gradient(145deg,#e58a53,#d97845);
}

.levelbtn.lock{
  opacity:.38;
}

.game-head{
  display:flex;
  align-items:center;
  gap:8px;
}

.game-head .level{
  flex:1;
  text-align:center;
  color:var(--muted);
  font-size:14px;
  font-weight:900;
}

.tool{
  border:1px solid var(--line);
  background:#fffdf9;
  border-radius:13px;
  padding:9px 10px;
  color:#6f675e;
  font-size:12px;
  font-weight:900;
}

.badge{
  display:inline-flex;
  margin-top:14px;
  padding:7px 11px;
  border-radius:99px;
  background:#fff1df;
  color:#a75d2f;
  font-size:12px;
  font-weight:900;
}

.char{
  margin:20px 0 5px;
  text-align:center;
  font-size:108px;
  line-height:1;
  font-weight:950;
  text-shadow:0 6px #00000006;
}

.instruction{
  text-align:center;
  color:var(--muted);
  font-size:14px;
}

.slots{
  min-height:76px;
  margin:21px 0 15px;
  display:flex;
  justify-content:center;
  gap:10px;
}

.slot{
  width:76px;
  height:76px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px dashed #d5c9ba;
  border-radius:19px;
  background:#fffdf9;
  font-size:29px;
  font-weight:950;
  transition:.2s;
}

.slot.filled{
  border-style:solid;
  border-color:var(--accent);
  background:#fff0e6;
  animation:snap .3s cubic-bezier(.2,1.5,.3,1);
}

.slot.target{
  border-color:var(--accent);
  background:#fff5ee;
  transform:scale(1.04);
}

@keyframes snap{
  0%{transform:scale(.7)}
  75%{transform:scale(1.1)}
  100%{transform:scale(1)}
}

.parts{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
}

.part{
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  border:1px solid var(--line);
  background:#fff;
  border-radius:19px;
  padding:18px;
  font-size:29px;
  font-weight:950;
  box-shadow:0 7px 17px #00000009;
}

.part.used{
  opacity:.25;
  pointer-events:none;
}

.part.dragging{
  position:fixed;
  z-index:200;
  pointer-events:none;
  transform:scale(1.08) rotate(2deg);
  box-shadow:0 18px 35px #0003;
}

.feedback{
  min-height:32px;
  margin:10px 0 2px;
  text-align:center;
  font-size:18px;
  font-weight:950;
}

.lives{
  text-align:center;
  letter-spacing:5px;
  margin:8px;
}

.tip{
  text-align:center;
  color:#aaa195;
  font-size:12px;
}

.combo{
  position:absolute;
  z-index:50;
  left:50%;
  top:180px;
  transform:translate(-50%,-50%);
  pointer-events:none;
  opacity:0;
  color:var(--accent);
  font-size:29px;
  font-weight:1000;
  text-shadow:0 4px #fff;
}

.combo.show{
  animation:comboPop .8s ease;
}

@keyframes comboPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
  30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}
  70%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-85%) scale(.95)}
}

.modal{
  position:fixed;
  inset:0;
  z-index:80;
  display:none;
  align-items:flex-end;
  background:#231c1590;
  backdrop-filter:blur(5px);
}

.modal.show{
  display:flex;
}

.sheet{
  width:100%;
  max-width:540px;
  margin:auto;
  padding:26px 22px calc(25px + env(safe-area-inset-bottom));
  text-align:center;
  background:#fffdf9;
  border-radius:30px 30px 0 0;
}

.result-title{
  font-size:25px;
  font-weight:1000;
}

.result-stars{
  font-size:40px;
  margin:10px;
}

.stats{
  display:flex;
  justify-content:space-around;
  text-align:center;
}

.stats b{
  display:block;
  font-size:24px;
}

.stats span{
  font-size:11px;
  color:var(--muted);
}

.daily-done{
  color:var(--good);
  font-weight:900;
}

@media(max-width:370px){
  h1{font-size:33px}
  .char{font-size:90px}
  .slot{width:66px;height:66px}
}
</style>
</head>

<body>

<canvas id="fx"></canvas>

<div class="app">

<section id="home" class="screen active">
  <div class="top">
    <div class="brand">拆拆字</div>
    <div class="coins">🪙 <b id="coins">100</b></div>
  </div>

  <div class="hero">
    <div class="hello">今天也來拆一個字吧！</div>
    <h1>漢字，其實很好玩。</h1>
    <div class="subtitle">把字拆開，再重新認識它。</div>
    <button id="startBtn" class="primary">▶ 開始遊戲</button>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <div class="title">🧩 繼續遊戲</div>
        <div class="small">第 <b id="currentLevel">1</b> 關</div>
      </div>
      <b id="progressText">0%</b>
    </div>
    <div class="progress">
      <div id="homeBar" class="bar"></div>
    </div>
  </div>

  <div class="card">
    <div class="title">☀️ 每日一拆</div>
    <div class="small">完成今日挑戰，獲得 20 金幣</div>
    <button id="dailyHomeBtn" class="primary">開始挑戰 →</button>
  </div>
</section>

<section id="levels" class="screen">
  <div class="top">
    <button class="back" data-go="home">‹</button>
    <div class="brand">闖關</div>
    <div></div>
  </div>

  <div class="card">
    <div class="title">🌱 漢字之旅</div>
    <div class="small">完成關卡可以獲得三星評價。</div>
    <div id="world" class="world"></div>
  </div>
</section>

<section id="game" class="screen">
  <div class="game-head">
    <button class="back" data-go="home">‹</button>
    <div id="gameLevel" class="level">第 1 關</div>
    <button id="soundBtn" class="tool">🔊</button>
    <button id="hintBtn" class="tool">💡</button>
  </div>

  <div id="modeBadge" class="badge">🧩 闖關模式</div>

  <div id="char" class="char">休</div>

  <div class="instruction">
    點擊或拖曳正確部件到框框
  </div>

  <div id="slots" class="slots"></div>
  <div id="parts" class="parts"></div>

  <div id="combo" class="combo"></div>
  <div id="feedback" class="feedback"></div>
  <div id="lives" class="lives">❤️❤️❤️</div>

  <div class="tip">
    點一下部件也可以直接放入正確位置
  </div>
</section>

<section id="daily" class="screen">
  <div class="top">
    <button class="back" data-go="home">‹</button>
    <div class="brand">☀️ 每日一拆</div>
    <div></div>
  </div>

  <div class="card" style="text-align:center">
    <div class="small">今日挑戰</div>
    <div id="dailyChar" class="char">？</div>
    <div class="small">完成即可獲得 20 金幣</div>
    <div id="dailyStatus"></div>
    <button id="dailyStartBtn" class="primary">開始挑戰</button>
  </div>
</section>

<section id="profile" class="screen">
  <div class="top">
    <div class="brand">我的</div>
    <div></div>
  </div>

  <div class="card" style="text-align:center">
    <div style="font-size:58px">🧩</div>
    <div class="title">拆字小達人</div>
    <div class="small">V1.1</div>
  </div>

  <div class="card">
    <div class="stats">
      <div>
        <b id="statDone">0</b>
        <span>完成關卡</span>
      </div>
      <div>
        <b id="statStars">0</b>
        <span>累積星星</span>
      </div>
      <div>
        <b id="statCombo">0</b>
        <span>最高連擊</span>
      </div>
    </div>
  </div>
</section>

</div>

<nav class="nav">
  <button class="active" data-nav="home">
    <span>🏠</span>首頁
  </button>

  <button data-nav="levels">
    <span>🧩</span>闖關
  </button>

  <button data-nav="daily">
    <span>⚡</span>挑戰
  </button>

  <button id="rankBtn">
    <span>🏆</span>排行
  </button>

  <button data-nav="profile">
    <span>👤</span>我的
  </button>
</nav>

<div id="result" class="modal">
  <div class="sheet">
    <div id="resultTitle" class="result-title">拆對了！</div>
    <div id="resultStars" class="result-stars"></div>

    <div class="stats">
      <div>
        <b id="resultScore">+300</b>
        <span>得分</span>
      </div>
      <div>
        <b id="resultCoins">+15</b>
        <span>金幣</span>
      </div>
      <div>
        <b id="resultCombo">x1</b>
        <span>連擊</span>
      </div>
    </div>

    <button id="nextBtn" class="primary">
      下一關 →
    </button>

    <button id="homeResultBtn" class="tool"
      style="width:100%;margin-top:10px">
      返回首頁
    </button>
  </div>
</div>

<script>
"use strict";

const LEVELS = [
  {char:"休",parts:["人","木"],decoys:["口","日"],hint:"一個人靠著樹休息。"},
  {char:"明",parts:["日","月"],decoys:["木","口"],hint:"太陽和月亮都很明亮。"},
  {char:"好",parts:["女","子"],decoys:["人","木"],hint:"女和子組成「好」。"},
  {char:"林",parts:["木","木"],decoys:["日","人"],hint:"兩棵樹就是林。"},
  {char:"男",parts:["田","力"],decoys:["口","木"],hint:"田加力組成男。"},
  {char:"信",parts:["亻","言"],decoys:["心","木"],hint:"人旁加言就是信。"},
  {char:"安",parts:["宀","女"],decoys:["日","木"],hint:"寶蓋頭下面有女。"},
  {char:"森",parts:["木","木","木"],decoys:["人","日"],hint:"三棵樹就是森。"},
  {char:"問",parts:["門","口"],decoys:["日","木"],hint:"門裡有口。"},
  {char:"聞",parts:["門","耳"],decoys:["日","口"],hint:"門裡有耳。"},
  {char:"看",parts:["手","目"],decoys:["木","日"],hint:"手放在眼睛上方。"},
  {char:"想",parts:["相","心"],decoys:["木","日"],hint:"相下面有心。"},
  {char:"思",parts:["田","心"],decoys:["日","木"],hint:"田下面有心。"},
  {char:"花",parts:["艹","化"],decoys:["日","人"],hint:"草字頭加化。"},
  {char:"草",parts:["艹","早"],decoys:["木","日"],hint:"草字頭加早。"},
  {char:"苗",parts:["艹","田"],decoys:["木","日"],hint:"草字頭加田。"},
  {char:"河",parts:["氵","可"],decoys:["日","木"],hint:"水旁加可。"},
  {char:"海",parts:["氵","每"],decoys:["日","母"],hint:"水旁加每。"},
  {char:"江",parts:["氵","工"],decoys:["日","木"],hint:"水旁加工。"},
  {char:"語",parts:["言","吾"],decoys:["口","日"],hint:"言加吾就是語。"}
];

const DEFAULT_STATE = {
  level:0,
  coins:100,
  stars:Array(LEVELS.length).fill(0),
  bestCombo:0,
  dailyDone:false
};

let state = loadState();

let currentIndex = 0;
let dailyMode = false;
let lives = 3;
let placed = [];
let combo = 0;
let soundOn = true;
let audioCtx = null;
let drag = null;
let startTime = 0;

function loadState(){
  try{
    const raw = JSON.parse(
      localStorage.getItem("chaichaizi_v11") || "null"
    );

    if(!raw || typeof raw !== "object")
      return structuredClone(DEFAULT_STATE);

    return {
      level:
        Number.isFinite(raw.level)
          ? Math.max(0,Math.min(raw.level,LEVELS.length-1))
          : 0,

      coins:
        Number.isFinite(raw.coins)
          ? Math.max(0,raw.coins)
          : 100,

      stars:
        Array.isArray(raw.stars)
          ? LEVELS.map((_,i)=>Number(raw.stars[i])||0)
          : Array(LEVELS.length).fill(0),

      bestCombo:
        Number(raw.bestCombo)||0,

      dailyDone:
        Boolean(raw.dailyDone)
    };
  }catch(e){
    localStorage.removeItem("chaichaizi_v11");
    return structuredClone(DEFAULT_STATE);
  }
}

function save(){
  localStorage.setItem(
    "chaichaizi_v11",
    JSON.stringify(state)
  );
  updateUI();
}

function el(id){
  return document.getElementById(id);
}

function updateUI(){
  el("coins").textContent = state.coins;

  el("currentLevel").textContent =
    Math.min(state.level + 1, LEVELS.length);

  const p =
    Math.round(
      state.stars.filter(x=>x>0).length /
      LEVELS.length * 100
    );

  el("progressText").textContent = p + "%";
  el("homeBar").style.width = p + "%";

  el("statDone").textContent =
    state.stars.filter(x=>x>0).length;

  el("statStars").textContent =
    state.stars.reduce((a,b)=>a+b,0);

  el("statCombo").textContent =
    state.bestCombo;
}

function go(id){
  document
    .querySelectorAll(".screen")
    .forEach(s=>s.classList.remove("active"));

  const target = el(id);

  if(target)
    target.classList.add("active");

  document
    .querySelectorAll(".nav button[data-nav]")
    .forEach(btn=>{
      btn.classList.toggle(
        "active",
        btn.dataset.nav===id
      );
    });

  if(id==="levels")
    renderLevels();

  if(id==="daily")
    renderDaily();

  updateUI();

  window.scrollTo({
    top:0,
    behavior:"instant"
  });
}

function startGame(isDaily=false){
  dailyMode = isDaily;
  lives = 3;
  placed = [];

  if(isDaily){
    currentIndex =
      new Date().getDate() % LEVELS.length;
  }else{
    currentIndex =
      Math.max(
        0,
        Math.min(state.level,LEVELS.length-1)
      );
  }

  loadQuestion(currentIndex);
  go("game");
}

function loadQuestion(index){
  currentIndex = index;
  startTime = performance.now();
  lives = 3;
  placed = [];

  const q = LEVELS[index];

  el("gameLevel").textContent =
    dailyMode
      ? "每日挑戰"
      : "第 " + (index+1) + " 關";

  el("modeBadge").textContent =
    dailyMode
      ? "☀️ 每日限定"
      : "🧩 闖關模式";

  el("char").textContent = q.char;
  el("feedback").textContent = "";
  el("lives").textContent = "❤️❤️❤️";

  renderSlots(q);
  renderParts(q);
}

function renderSlots(q){
  const box = el("slots");
  box.innerHTML = "";

  q.parts.forEach((part,index)=>{
    const slot =
      document.createElement("div");

    slot.className = "slot";
    slot.dataset.expect = part;
    slot.dataset.index = index;

    box.appendChild(slot);
  });
}

function renderParts(q){
  const pool = [];

  q.parts.forEach((part,i)=>{
    pool.push({
      value:part,
      correct:true,
      uid:"c"+i
    });
  });

  q.decoys.forEach((part,i)=>{
    pool.push({
      value:part,
      correct:false,
      uid:"d"+i
    });
  });

  pool.sort(()=>Math.random()-.5);

  const box = el("parts");
  box.innerHTML = "";

  pool.forEach(item=>{
    const btn =
      document.createElement("button");

    btn.className = "part";
    btn.textContent = item.value;

    btn.dataset.value = item.value;
    btn.dataset.correct =
      item.correct ? "1" : "0";
    btn.dataset.uid = item.uid;

    btn.addEventListener(
      "click",
      ()=>tapPart(btn)
    );

    btn.addEventListener(
      "pointerdown",
      startDrag
    );

    box.appendChild(btn);
  });
}

function tapPart(btn){
  if(btn.classList.contains("used"))
    return;

  const value = btn.dataset.value;

  const slot =
    [...document.querySelectorAll(".slot")]
    .find(s=>
      !s.classList.contains("filled") &&
      s.dataset.expect===value
    );

  if(
    btn.dataset.correct==="1" &&
    slot
  ){
    placePart(btn,slot);
  }else{
    wrong(btn);
  }
}

function startDrag(e){
  const btn = e.currentTarget;

  if(btn.classList.contains("used"))
    return;

  const r =
    btn.getBoundingClientRect();

  drag = {
    btn,
    pointerId:e.pointerId,
    offsetX:e.clientX-r.left,
    offsetY:e.clientY-r.top
  };

  try{
    btn.setPointerCapture(e.pointerId);
  }catch(err){}

  btn.classList.add("dragging");

  btn.style.left = r.left+"px";
  btn.style.top = r.top+"px";
  btn.style.width = r.width+"px";
  btn.style.height = r.height+"px";

  btn.addEventListener(
    "pointermove",
    moveDrag
  );

  btn.addEventListener(
    "pointerup",
    endDrag,
    {once:true}
  );

  btn.addEventListener(
    "pointercancel",
    endDrag,
    {once:true}
  );
}

function moveDrag(e){
  if(!drag)
    return;

  const btn = drag.btn;

  btn.style.left =
    (e.clientX-drag.offsetX)+"px";

  btn.style.top =
    (e.clientY-drag.offsetY)+"px";

  document
    .querySelectorAll(".slot")
    .forEach(slot=>{
      const r =
        slot.getBoundingClientRect();

      const hit =
        e.clientX>r.left-20 &&
        e.clientX<r.right+20 &&
        e.clientY>r.top-20 &&
        e.clientY<r.bottom+20;

      slot.classList.toggle(
        "target",
        hit &&
        !slot.classList.contains("filled")
      );
    });
}

function endDrag(e){
  if(!drag)
    return;

  const btn = drag.btn;
  drag = null;

  btn.classList.remove("dragging");

  btn.style.left = "";
  btn.style.top = "";
  btn.style.width = "";
  btn.style.height = "";

  let best = null;
  let distance = Infinity;

  document
    .querySelectorAll(".slot")
    .forEach(slot=>{
      slot.classList.remove("target");

      if(slot.classList.contains("filled"))
        return;

      const r =
        slot.getBoundingClientRect();

      const cx =
        r.left+r.width/2;

      const cy =
        r.top+r.height/2;

      const d =
        Math.hypot(
          e.clientX-cx,
          e.clientY-cy
        );

      if(d<distance){
        distance=d;
        best=slot;
      }
    });

  if(best && distance<105){

    if(
      btn.dataset.correct==="1" &&
      btn.dataset.value===
      best.dataset.expect
    ){
      placePart(btn,best);
    }else{
      wrong(btn);
    }
  }
}

function placePart(btn,slot){
  btn.classList.add("used");

  slot.classList.add("filled");
  slot.textContent =
    btn.dataset.value;

  placed.push(
    btn.dataset.uid
  );

  sound(630,.08);

  particleBurst(slot);

  const needed =
    LEVELS[currentIndex].parts.length;

  if(placed.length>=needed){
    setTimeout(
      completeLevel,
      450
    );
  }
}

function wrong(btn){
  lives--;

  sound(170,.12);

  btn.animate(
    [
      {transform:"translateX(-6px)"},
      {transform:"translateX(6px)"},
      {transform:"translateX(0)"}
    ],
    {duration:240}
  );

  el("feedback").textContent =
    "再試一次！";

  el("feedback").style.color =
    "var(--bad)";

  el("lives").textContent =
    "❤️".repeat(Math.max(0,lives)) +
    "🖤".repeat(Math.max(0,3-lives));

  if(lives<=0){
    setTimeout(()=>{
      alert("別灰心，再試一次就會成功 💪");
      loadQuestion(currentIndex);
    },350);
  }
}

function useHint(){
  if(state.coins<10){
    el("feedback").textContent =
      "金幣不足";
    return;
  }

  state.coins -= 10;
  save();

  el("feedback").style.color =
    "var(--gold)";

  el("feedback").textContent =
    "💡 " + LEVELS[currentIndex].hint;

  const slot =
    [...document.querySelectorAll(".slot")]
    .find(s=>
      !s.classList.contains("filled")
    );

  if(slot){
    slot.classList.add("target");

    setTimeout(()=>{
      slot.classList.remove("target");
    },1600);
  }
}

function completeLevel(){
  const elapsed =
    (performance.now()-startTime)/1000;

  let stars = 1;

  if(lives===3 && elapsed<12)
    stars=3;
  else if(lives>=2)
    stars=2;

  combo++;

  state.bestCombo =
    Math.max(
      state.bestCombo,
      combo
    );

  const reward =
    dailyMode ? 20 : stars*5;

  state.coins += reward;

  if(dailyMode){
    state.dailyDone=true;
  }else{
    state.stars[currentIndex] =
      Math.max(
        state.stars[currentIndex],
        stars
      );

    if(
      currentIndex===state.level &&
      state.level<LEVELS.length-1
    ){
      state.level++;
    }
  }

  save();

  showCombo();

  soundWin();

  confetti();

  setTimeout(()=>{
    showResult(
      stars,
      reward
    );
  },500);
}

function showCombo(){
  if(combo<2)
    return;

  const c = el("combo");

  c.textContent =
    "🔥 "+combo+" COMBO!";

  c.classList.remove("show");

  void c.offsetWidth;

  c.classList.add("show");
}

function showResult(stars,reward){
  el("resultTitle").textContent =
    stars===3
      ? "完美拆字！ 🎉"
      : stars===2
      ? "拆對了！ 👏"
      : "完成關卡！ 💪";

  el("resultStars").textContent =
    "⭐".repeat(stars) +
    "☆".repeat(3-stars);

  el("resultScore").textContent =
    "+"+(stars*100);

  el("resultCoins").textContent =
    "+"+reward;

  el("resultCombo").textContent =
    "x"+combo;

  el("nextBtn").style.display =
    dailyMode ||
    currentIndex>=LEVELS.length-1
      ? "none"
      : "block";

  el("result").classList.add("show");
}

function nextLevel(){
  el("result").classList.remove("show");

  if(currentIndex<LEVELS.length-1){
    dailyMode=false;
    loadQuestion(currentIndex+1);
    go("game");
  }
}

function renderLevels(){
  const box = el("world");
  box.innerHTML = "";

  LEVELS.forEach((q,index)=>{
    const btn =
      document.createElement("button");

    const unlocked =
      index===0 ||
      state.stars[index-1]>0 ||
      index<=state.level;

    btn.className =
      "levelbtn" +
      (state.stars[index]>0 ? " done":"") +
      (!unlocked ? " lock":"");

    btn.innerHTML =
      state.stars[index]>0
        ? (index+1)+"<br>"+
          "⭐".repeat(state.stars[index])
        : (!unlocked ? "🔒<br>":"")+
          (index+1);

    btn.disabled =
      !unlocked;

    btn.addEventListener(
      "click",
      ()=>{
        if(!unlocked)
          return;

        dailyMode=false;
        currentIndex=index;
        loadQuestion(index);
        go("game");
      }
    );

    box.appendChild(btn);
  });
}

function renderDaily(){
  const index =
    new Date().getDate() %
    LEVELS.length;

  el("dailyChar").textContent =
    LEVELS[index].char;

  if(state.dailyDone){
    el("dailyStatus").innerHTML =
      '<div class="daily-done">✓ 今日已完成</div>';

    el("dailyStartBtn").disabled=true;
    el("dailyStartBtn").textContent =
      "今日已完成";
  }else{
    el("dailyStatus").innerHTML="";
    el("dailyStartBtn").disabled=false;
    el("dailyStartBtn").textContent =
      "開始挑戰";
  }
}

function toggleSound(){
  soundOn=!soundOn;

  el("soundBtn").textContent =
    soundOn ? "🔊":"🔇";
}

function ensureAudio(){
  if(!soundOn)
    return;

  try{
    if(!audioCtx){
      audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();
    }

    if(audioCtx.state==="suspended")
      audioCtx.resume();
  }catch(e){}
}

function sound(freq,duration){
  if(!soundOn)
    return;

  ensureAudio();

  if(!audioCtx)
    return;

  try{
    const osc =
      audioCtx.createOscillator();

    const gain =
      audioCtx.createGain();

    osc.frequency.value=freq;
    osc.type="sine";

    gain.gain.setValueAtTime(
      .0001,
      audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .06,
      audioCtx.currentTime+.01
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      audioCtx.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(
      audioCtx.currentTime+
      duration+.03
    );
  }catch(e){}
}

function soundWin(){
  [520,660,800,1040]
    .forEach((f,i)=>{
      setTimeout(
        ()=>sound(f,.13),
        i*90
      );
    });
}

function particleBurst(slot){
  const canvas=el("fx");
  const ctx=canvas.getContext("2d");

  if(!ctx)
    return;

  const d=
    window.devicePixelRatio||1;

  canvas.width=
    innerWidth*d;

  canvas.height=
    innerHeight*d;

  ctx.setTransform(
    d,0,0,d,0,0
  );

  const r=
    slot.getBoundingClientRect();

  const particles=[];

  for(let i=0;i<18;i++){
    const a=Math.random()*Math.PI*2;
    const v=2+Math.random()*4;

    particles.push({
      x:r.left+r.width/2,
      y:r.top+r.height/2,
      vx:Math.cos(a)*v,
      vy:Math.sin(a)*v-1,
      life:1,
      size:2+Math.random()*4
    });
  }

  animateParticles(
    particles,
    ctx
  );
}

function confetti(){
  const canvas=el("fx");
  const ctx=canvas.getContext("2d");

  if(!ctx)
    return;

  const d=
    window.devicePixelRatio||1;

  canvas.width=
    innerWidth*d;

  canvas.height=
    innerHeight*d;

  ctx.setTransform(
    d,0,0,d,0,0
  );

  const particles=[];

  for(let i=0;i<60;i++){
    particles.push({
      x:innerWidth/2,
      y:innerHeight*.34,
      vx:(Math.random()-.5)*10,
      vy:-3-Math.random()*8,
      life:1,
      size:3+Math.random()*5
    });
  }

  animateParticles(
    particles,
    ctx
  );
}

function animateParticles(
  particles,
  ctx
){
  function frame(){
    ctx.clearRect(
      0,0,
      innerWidth,
      innerHeight
    );

    let alive=false;

    particles.forEach(p=>{
      if(p.life<=0)
        return;

      alive=true;

      p.x+=p.vx;
      p.y+=p.vy;
      p.vy+=.16;
      p.life-=.025;

      ctx.globalAlpha=
        Math.max(0,p.life);

      ctx.fillStyle =
        Math.random()>.5
          ? "#df814b"
          : "#d5a43a";

      ctx.fillRect(
        p.x,
        p.y,
        p.size,
        p.size
      );
    });

    ctx.globalAlpha=1;

    if(alive)
      requestAnimationFrame(frame);
  }

  frame();
}

/* 所有按鈕都在這裡正式綁定 */
document.addEventListener(
  "DOMContentLoaded",
  ()=>{
    el("startBtn").addEventListener(
      "click",
      ()=>startGame(false)
    );

    el("dailyHomeBtn").addEventListener(
      "click",
      ()=>go("daily")
    );

    el("dailyStartBtn").addEventListener(
      "click",
      ()=>startGame(true)
    );

    el("hintBtn").addEventListener(
      "click",
      useHint
    );

    el("soundBtn").addEventListener(
      "click",
      toggleSound
    );

    el("nextBtn").addEventListener(
      "click",
      nextLevel
    );

    el("homeResultBtn").addEventListener(
      "click",
      ()=>{
        el("result").classList.remove("show");
        go("home");
      }
    );

    el("rankBtn").addEventListener(
      "click",
      ()=>{
        alert("排行榜會在下一版加入 🏆");
      }
    );

    document
      .querySelectorAll("[data-go]")
      .forEach(btn=>{
        btn.addEventListener(
          "click",
          ()=>go(btn.dataset.go)
        );
      });

    document
      .querySelectorAll(
        ".nav button[data-nav]"
      )
      .forEach(btn=>{
        btn.addEventListener(
          "click",
          ()=>go(btn.dataset.nav)
        );
      });

    updateUI();
    renderLevels();
    renderDaily();
  }
);
</script>
