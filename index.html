<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F2E8">
<title>拆拆字 V1.0</title>
<style>
:root{
  --bg:#f5f0e7;--paper:#fffdf8;--paper2:#fbf7ef;--ink:#292724;
  --muted:#91897e;--line:#e8dfd2;--accent:#d97845;--accent2:#efaa70;
  --gold:#d5a43a;--green:#6e9b76;--shadow:0 18px 45px rgba(73,55,35,.10);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;min-height:100vh;margin:auto;padding:18px 18px 104px;position:relative;overflow:hidden}
.app:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background:radial-gradient(circle at 15% 10%,#fff 0 2px,transparent 3px),radial-gradient(circle at 85% 35%,#fff 0 1px,transparent 2px);background-size:80px 80px}

.top{display:flex;justify-content:space-between;align-items:center;min-height:42px}
.brand{font-weight:950;font-size:23px;letter-spacing:3px}
.coins{background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:99px;padding:8px 13px;font-weight:900;box-shadow:0 5px 16px #00000009}
.screen{display:none;animation:fade .28s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.hero{margin-top:20px;background:linear-gradient(145deg,#fffdf9 0%,#f3e5d3 100%);border:1px solid #eee3d4;border-radius:30px;padding:30px 23px 25px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"拆";position:absolute;right:-10px;top:-20px;font-size:170px;font-weight:950;color:#d9784510;transform:rotate(8deg)}
.hello{font-size:14px;color:var(--muted);position:relative;z-index:1}
h1{font-size:38px;line-height:1.12;margin:8px 0 8px;letter-spacing:-1px;position:relative;z-index:1}
.subtitle{color:#716a61;position:relative;z-index:1}
.primary{width:100%;border:0;border-radius:18px;background:linear-gradient(180deg,#e58a53,#d97845);color:#fff;font-size:17px;font-weight:950;padding:16px;margin-top:21px;box-shadow:0 10px 20px #d9784540;position:relative;z-index:1;transition:.15s}
.primary:active{transform:scale(.98);box-shadow:0 5px 12px #d9784530}

.card{background:rgba(255,253,248,.88);border:1px solid var(--line);border-radius:24px;padding:20px;margin-top:15px;box-shadow:0 9px 28px #00000007}
.section-title{font-size:18px;font-weight:950;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center}
.progress{height:9px;background:#ece3d7;border-radius:99px;overflow:hidden;margin-top:11px}
.bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .35s ease}
.small{font-size:13px;color:var(--muted)}
.back{border:0;background:#fffdf8;border:1px solid var(--line);width:40px;height:40px;border-radius:14px;font-size:28px;line-height:1;box-shadow:0 5px 14px #00000008}
.nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);max-width:520px;width:100%;background:rgba(255,253,249,.92);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 8px calc(10px + env(safe-area-inset-bottom))}
.nav button{background:none;border:0;color:#91897f;font-size:11px;font-weight:700;min-width:54px;padding:3px 2px}
.nav button.active{color:var(--accent);font-weight:950}
.nav button:first-line{font-size:18px}

.game-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.level{color:var(--muted);font-weight:900;font-size:14px}
.hint{border:1px solid #f0dca5;background:#fff6d9;color:#7d631b;border-radius:14px;padding:10px 13px;font-weight:900}
.char{font-size:104px;text-align:center;font-weight:950;line-height:1;margin:24px 0 10px;text-shadow:0 7px 0 #00000006}
.instruction{text-align:center;color:var(--muted);font-size:14px}
.slots{display:flex;justify-content:center;gap:11px;margin:22px 0 15px;min-height:76px}
.slot{width:76px;height:76px;border-radius:20px;border:2px dashed #d6cabb;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:950;background:#fffdf9;transition:.2s}
.slot:not(:empty){border-style:solid;border-color:var(--accent);background:#fff2e8;animation:pop .2s ease}
@keyframes pop{from{transform:scale(.9)}to{transform:scale(1)}}
.parts{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:12px}
.part{border:1px solid var(--line);background:#fff;border-radius:19px;padding:18px;font-size:29px;font-weight:950;box-shadow:0 7px 16px #00000008;transition:.16s}
.part:active{transform:scale(.97)}
.part.selected{border:2px solid var(--accent);background:#fff0e6;color:#b85e31;box-shadow:0 8px 20px #d9784520;transform:translateY(-2px)}
.feedback{min-height:28px;text-align:center;font-size:18px;font-weight:950;margin:8px 0}
.lives{letter-spacing:6px;text-align:center;margin:11px 0;color:#d97845}
.game-tip{font-size:12px;text-align:center;color:#aaa195;margin-top:3px}

.world{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:15px}
.levelbtn{aspect-ratio:1;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 5px 13px #00000008;font-weight:950;color:#5f5951}
.levelbtn.done{background:linear-gradient(145deg,#e58a53,#d97845);color:#fff;border:0}
.levelbtn:active{transform:scale(.96)}

.profileStat{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--line)}
.profileStat:last-child{border-bottom:0}

.modal{position:fixed;z-index:50;inset:0;background:rgba(35,28,21,.55);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.modal.show{display:flex}
.sheet{max-width:520px;width:100%;background:#fffdf9;border-radius:30px 30px 0 0;padding:25px 22px calc(25px + env(safe-area-inset-bottom));box-shadow:0 -15px 45px #0003;animation:sheet .25s ease}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
.choice{width:100%;border:1px solid var(--line);background:#f6efe4;border-radius:16px;padding:15px;margin:6px 0;font-size:16px;font-weight:850}

.challenge-badge{display:inline-flex;align-items:center;gap:5px;padding:7px 10px;border-radius:99px;background:#fff1df;color:#a75d2f;font-size:12px;font-weight:900}
.divider{height:1px;background:var(--line);margin:18px 0}

.game-stage{position:relative;margin-top:10px;padding:8px 0 2px}
.drag-hint{text-align:center;color:#aaa096;font-size:12px;margin-top:2px}
.part{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.part.dragging{position:fixed;z-index:1000;pointer-events:none;transform:scale(1.08) rotate(2deg);box-shadow:0 18px 35px #0003}
.slot.target{border-color:var(--accent);background:#fff0e6;box-shadow:0 0 0 6px #d9784510;animation:targetPulse .7s ease-in-out infinite alternate}
.slot.snap{animation:snapIn .32s cubic-bezier(.2,.9,.2,1);border-style:solid;background:#fff0e6}
@keyframes targetPulse{from{transform:scale(1)}to{transform:scale(1.035)}}
@keyframes snapIn{0%{transform:scale(.7);opacity:.4}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.combo-burst{position:absolute;left:50%;top:170px;transform:translate(-50%,-50%) scale(.7);z-index:30;pointer-events:none;text-align:center;font-weight:1000;color:var(--accent);font-size:27px;text-shadow:0 4px 0 #fff;opacity:0}
.combo-burst.show{animation:comboBurst .75s cubic-bezier(.2,.8,.2,1)}
@keyframes comboBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.65) rotate(-5deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(2deg)}75%{opacity:1;transform:translate(-50%,-55%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(.95)}}
#particles{position:fixed;inset:0;z-index:90;pointer-events:none}
.result-stars{display:flex;justify-content:center;gap:7px;font-size:38px;margin:7px 0 14px}
.star{display:inline-block;opacity:.25;filter:grayscale(1);transform:scale(.7)}
.star.on{opacity:1;filter:none;animation:starPop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes starPop{0%{transform:scale(.3) rotate(-20deg)}75%{transform:scale(1.18) rotate(5deg)}100%{transform:scale(1)}}
.result-score{display:flex;justify-content:center;gap:26px;margin:12px 0 2px}
.result-score b{display:block;font-size:22px}.result-score span{font-size:11px;color:var(--muted)}
.sound-toggle{border:1px solid var(--line);background:#fffdf8;border-radius:13px;padding:8px 11px;font-weight:800;color:#6f675e}
</style>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#F5F0E7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="拆拆字"></head>
<body><canvas id="particles"></canvas><div id="comboBurst" class="combo-burst"></div>
<div class="app">
<div id="home" class="screen active">
  <div class="top"><div class="brand">拆拆字</div><div class="coins">🪙 <span id="coins">100</span></div></div>
  <div class="hero"><div class="hello">今天也來拆一個字吧！</div><h1>漢字，其實很好玩。</h1><div class="subtitle">把字拆開，再重新認識它。</div><button class="primary" onclick="startGame()">▶ 開始遊戲</button></div>
  <div class="card"><div class="row"><div><div class="section-title">🧩 繼續遊戲</div><div class="small">第 <span id="currentLevel">1</span> 關</div></div><b id="progressText">0%</b></div><div class="progress"><div class="bar" id="homeBar" style="width:0%"></div></div></div>
  <div class="card"><div class="section-title">☀️ 每日一拆</div><div class="small">完成今日挑戰，獲得 20 金幣</div><button class="primary" onclick="startDaily()">開始挑戰 →</button></div>
</div>

<div id="levels" class="screen">
  <div class="top"><button class="back" onclick="go('home')">‹</button><div class="brand">闖關</div><div></div></div>
  <div class="card"><div class="section-title">🌱 漢字之旅</div><div class="small">完成關卡可以獲得三星評價。</div><div class="world" id="world"></div></div>
</div>

<div id="game" class="screen">
  <div class="game-head"><button class="back" onclick="go('home')">‹</button><div class="level" id="gameLevel">第 1 關</div><button class="sound-toggle" onclick="soundOn=!soundOn;this.textContent=soundOn?'🔊 音效':'🔇 靜音'">🔊 音效</button><button class="hint" onclick="showHint()">💡 提示</button></div>
  <div class="challenge-badge" id="modeBadge">🧩 闖關模式</div><div class="char" id="char">休</div><div class="instruction">選出組成這個字的正確部件</div>
  <div class="slots" id="slots"></div><div class="parts" id="parts"></div>
  <div class="feedback" id="feedback"></div><div class="lives" id="lives">❤️❤️❤️</div><div class="game-tip">提示會從金幣中扣除 10 枚</div>
</div>

<div id="daily" class="screen">
 <div class="top"><button class="back" onclick="go('home')">‹</button><div class="brand">☀️ 每日一拆</div><div></div></div>
 <div class="card" style="text-align:center"><div class="small">今日挑戰</div><div class="char" id="dailyChar">？</div><div class="small">答對即可獲得 20 金幣</div><button class="primary" onclick="startGame(true)">開始挑戰</button></div>
</div>

<div id="profile" class="screen">
 <div class="top"><div class="brand">我的</div><div></div></div>
 <div class="card" style="text-align:center"><div style="font-size:56px">🧩</div><h2>拆字小達人</h2><div class="small">Lv. 1</div></div>
 <div class="card"><div class="profileStat"><span>完成關卡</span><b id="statDone">0</b></div><div class="profileStat"><span>目前金幣</span><b id="statCoins">100</b></div><div class="profileStat"><span>最長連擊</span><b id="statCombo">0</b></div><div class="profileStat"><span>成就</span><b>1 / 10</b></div></div>
</div>

<div class="nav">
 <button id="nav-home" class="active" onclick="go('home')">🏠<br>首頁</button>
 <button id="nav-levels" onclick="go('levels')">🧩<br>闖關</button>
 <button id="nav-daily" onclick="go('daily')">⚡<br>挑戰</button>
 <button onclick="alert('V1.0 預留：排行榜')">🏆<br>排行</button>
 <button id="nav-profile" onclick="go('profile')">👤<br>我的</button>
</div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>

<script>
const questions = [{"char": "休", "parts": ["人", "木", "日", "口"], "answer": ["人", "木"], "tip": "人靠著樹休息。"}, {"char": "明", "parts": ["日", "月", "木", "目"], "answer": ["日", "月"], "tip": "日與月合在一起，表示明亮。"}, {"char": "好", "parts": ["女", "子", "人", "口"], "answer": ["女", "子"], "tip": "女與子組成「好」。"}, {"char": "林", "parts": ["木", "木", "日", "人"], "answer": ["木", "木"], "tip": "兩棵樹組成「林」。"}, {"char": "森", "parts": ["木", "木", "木", "人"], "answer": ["木", "木", "木"], "tip": "三棵樹組成「森」。"}, {"char": "男", "parts": ["田", "力", "日", "刀"], "answer": ["田", "力"], "tip": "田加力組成「男」。"}, {"char": "尖", "parts": ["小", "大", "木", "人"], "answer": ["小", "大"], "tip": "上小下大，形成「尖」。"}, {"char": "從", "parts": ["人", "人", "彳", "木"], "answer": ["人", "人"], "tip": "兩個人前後相隨，有「從」的意思。"}, {"char": "信", "parts": ["亻", "言", "木", "口"], "answer": ["亻", "言"], "tip": "人與言組成「信」。"}, {"char": "休", "parts": ["亻", "木", "月", "日"], "answer": ["亻", "木"], "tip": "人靠著樹就是休息。"}, {"char": "語", "parts": ["言", "吾", "口", "日"], "answer": ["言", "吾"], "tip": "言與吾組成「語」。"}, {"char": "清", "parts": ["氵", "青", "日", "木"], "answer": ["氵", "青"], "tip": "水旁加青是「清」。"}, {"char": "晴", "parts": ["日", "青", "月", "青"], "answer": ["日", "青"], "tip": "日加青形成「晴」。"}, {"char": "情", "parts": ["忄", "青", "心", "日"], "answer": ["忄", "青"], "tip": "心旁加青是「情」。"}, {"char": "請", "parts": ["言", "青", "日", "月"], "answer": ["言", "青"], "tip": "言旁加青是「請」。"}, {"char": "湖", "parts": ["氵", "胡", "日", "月"], "answer": ["氵", "胡"], "tip": "水旁加胡是「湖」。"}, {"char": "河", "parts": ["氵", "可", "日", "口"], "answer": ["氵", "可"], "tip": "水旁加可是「河」。"}, {"char": "海", "parts": ["氵", "每", "日", "母"], "answer": ["氵", "每"], "tip": "水旁加每是「海」。"}, {"char": "江", "parts": ["氵", "工", "木", "口"], "answer": ["氵", "工"], "tip": "水旁加工是「江」。"}, {"char": "花", "parts": ["艹", "化", "日", "人"], "answer": ["艹", "化"], "tip": "草字頭加化是「花」。"}, {"char": "草", "parts": ["艹", "早", "日", "木"], "answer": ["艹", "早"], "tip": "草字頭加早是「草」。"}, {"char": "茶", "parts": ["艹", "人", "木", "日"], "answer": ["艹", "人", "木"], "tip": "草字頭加人與木，形成「茶」。"}, {"char": "苗", "parts": ["艹", "田", "日", "木"], "answer": ["艹", "田"], "tip": "草字頭加田是「苗」。"}, {"char": "林", "parts": ["木", "木", "人", "口"], "answer": ["木", "木"], "tip": "兩木成林。"}, {"char": "相", "parts": ["木", "目", "日", "口"], "answer": ["木", "目"], "tip": "木與目組成「相」。"}, {"char": "休", "parts": ["亻", "木", "口", "日"], "answer": ["亻", "木"], "tip": "人依樹而休息。"}, {"char": "位", "parts": ["亻", "立", "木", "日"], "answer": ["亻", "立"], "tip": "人旁加立是「位」。"}, {"char": "住", "parts": ["亻", "主", "日", "木"], "answer": ["亻", "主"], "tip": "人旁加主是「住」。"}, {"char": "作", "parts": ["亻", "乍", "日", "木"], "answer": ["亻", "乍"], "tip": "人旁加乍是「作」。"}, {"char": "你", "parts": ["亻", "尔", "日", "木"], "answer": ["亻", "尔"], "tip": "人旁加尔是「你」。"}, {"char": "他", "parts": ["亻", "也", "日", "木"], "answer": ["亻", "也"], "tip": "人旁加也是「他」。"}, {"char": "地", "parts": ["土", "也", "日", "木"], "answer": ["土", "也"], "tip": "土旁加也是「地」。"}, {"char": "池", "parts": ["氵", "也", "日", "土"], "answer": ["氵", "也"], "tip": "水旁加也是「池」。"}, {"char": "城", "parts": ["土", "成", "日", "口"], "answer": ["土", "成"], "tip": "土旁加成是「城」。"}, {"char": "安", "parts": ["宀", "女", "日", "木"], "answer": ["宀", "女"], "tip": "寶蓋頭下有女，形成「安」。"}, {"char": "家", "parts": ["宀", "豕", "人", "口"], "answer": ["宀", "豕"], "tip": "寶蓋頭加豕是「家」。"}, {"char": "室", "parts": ["宀", "至", "日", "木"], "answer": ["宀", "至"], "tip": "寶蓋頭加至是「室」。"}, {"char": "空", "parts": ["穴", "工", "日", "木"], "answer": ["穴", "工"], "tip": "穴加工是「空」。"}, {"char": "笑", "parts": ["竹", "夭", "日", "木"], "answer": ["竹", "夭"], "tip": "竹字頭加夭是「笑」。"}, {"char": "答", "parts": ["竹", "合", "日", "口"], "answer": ["竹", "合"], "tip": "竹字頭加合是「答」。"}, {"char": "筆", "parts": ["竹", "聿", "木", "日"], "answer": ["竹", "聿"], "tip": "竹字頭加聿是「筆」。"}, {"char": "想", "parts": ["相", "心", "日", "木"], "answer": ["相", "心"], "tip": "相加心是「想」。"}, {"char": "忘", "parts": ["亡", "心", "日", "木"], "answer": ["亡", "心"], "tip": "亡加心是「忘」。"}, {"char": "思", "parts": ["田", "心", "日", "木"], "answer": ["田", "心"], "tip": "田加心是「思」。"}, {"char": "意", "parts": ["音", "心", "日", "木"], "answer": ["音", "心"], "tip": "音加心是「意」。"}, {"char": "念", "parts": ["今", "心", "日", "木"], "answer": ["今", "心"], "tip": "今加心是「念」。"}, {"char": "看", "parts": ["手", "目", "日", "木"], "answer": ["手", "目"], "tip": "手放在眼睛上方，有「看」的形象。"}, {"char": "聞", "parts": ["門", "耳", "日", "口"], "answer": ["門", "耳"], "tip": "門裡有耳，就是「聞」。"}, {"char": "問", "parts": ["門", "口", "日", "耳"], "answer": ["門", "口"], "tip": "門裡有口，是「問」。"}, {"char": "間", "parts": ["門", "日", "月", "口"], "answer": ["門", "日"], "tip": "門中有日是「間」。"}];
let state = JSON.parse(localStorage.getItem('chaiState')||'null') || {level:0,coins:100,done:0,combo:0,maxCombo:0};
let selected=[], lives=3, daily=false;

function save(){localStorage.setItem('chaiState',JSON.stringify(state)); updateUI();}
function updateUI(){
 document.getElementById('coins').textContent=state.coins;
 document.getElementById('currentLevel').textContent=Math.min(state.level+1,questions.length);
 document.getElementById('progressText').textContent=Math.round(state.level/questions.length*100)+'%';
 document.getElementById('homeBar').style.width=(state.level/questions.length*100)+'%';
 document.getElementById('statDone').textContent=state.done;
 document.getElementById('statCoins').textContent=state.coins;
 document.getElementById('statCombo').textContent=state.maxCombo;
}
function go(id){
 document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
 const n=document.getElementById('nav-'+id); if(n)n.classList.add('active');
 if(id==='levels')renderLevels(); updateUI();
}
function startGame(isDaily=false){ daily=isDaily; lives=3; state.combo=0; const idx=isDaily?Math.floor(new Date().getDate()%questions.length):Math.min(state.level,questions.length-1); loadQuestion(idx); go('game'); }
let audioCtx=null, soundOn=true, dragInfo=null, levelStart=0;

function audioInit(){
  if(!soundOn)return;
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended") audioCtx.resume();
}
function tone(freq,dur,type="sine",vol=.045,delay=0){
  if(!soundOn)return;
  audioInit(); if(!audioCtx)return;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0,audioCtx.currentTime+delay);
  g.gain.linearRampToValueAtTime(vol,audioCtx.currentTime+delay+.012);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+delay+dur);
  o.connect(g);g.connect(audioCtx.destination);o.start(audioCtx.currentTime+delay);o.stop(audioCtx.currentTime+delay+dur+.03);
}
function soundPick(){tone(430,.08,"sine",.035)}
function soundSnap(){tone(620,.09,"triangle",.045);tone(880,.12,"triangle",.035,.06)}
function soundWrong(){tone(170,.16,"sawtooth",.035)}
function soundWin(){[523,659,784,1046].forEach((f,i)=>tone(f,.18,"triangle",.05,i*.08))}

function loadQuestion(idx){
  window.current=questions[idx]; levelStart=performance.now();
  document.getElementById('gameLevel').textContent=(daily?'每日挑戰':'第 '+(idx+1)+' 關');
  document.getElementById('modeBadge').textContent=daily?'☀️ 每日挑戰':'🧩 闖關模式';
  document.getElementById('char').textContent=window.current.char;
  document.getElementById('feedback').textContent='';
  document.getElementById('comboBurst').className='combo-burst';
  document.getElementById('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);
  selected=[];
  const slots=document.getElementById('slots'); slots.innerHTML='';
  window.current.answer.forEach((ans,i)=>{
    const s=document.createElement('div');s.className='slot';s.dataset.index=i;s.dataset.answer=ans;slots.appendChild(s);
  });
  const p=document.getElementById('parts'); p.innerHTML='';
  [...window.current.parts].sort(()=>Math.random()-.5).forEach((x)=>{
    const b=document.createElement('button');b.className='part';b.textContent=x;b.dataset.value=x;
    addDrag(b);p.appendChild(b);
  });
}
function addDrag(el){
  el.addEventListener('pointerdown',startDrag);
}
function startDrag(e){
  if(selected.includes(e.currentTarget.dataset.value)) return;
  audioInit(); soundPick();
  const el=e.currentTarget; el.setPointerCapture?.(e.pointerId);
  const r=el.getBoundingClientRect();
  dragInfo={el,value:el.dataset.value,pointerId:e.pointerId,ox:e.clientX-r.left,oy:e.clientY-r.top,clone:null};
  el.classList.add('dragging');
  el.style.left=(e.clientX-dragInfo.ox)+'px';el.style.top=(e.clientY-dragInfo.oy)+'px';
  el.style.width=r.width+'px';el.style.height=r.height+'px';
  el.style.position='fixed';
  el.style.margin='0';
  document.querySelectorAll('.slot').forEach(s=>s.classList.add('target'));
  el.addEventListener('pointermove',moveDrag);
  el.addEventListener('pointerup',endDrag,{once:true});
  el.addEventListener('pointercancel',endDrag,{once:true});
}
function moveDrag(e){
  if(!dragInfo)return;
  const el=dragInfo.el;
  el.style.left=(e.clientX-dragInfo.ox)+'px';el.style.top=(e.clientY-dragInfo.oy)+'px';
  let over=null;
  document.querySelectorAll('.slot').forEach(s=>{
    const r=s.getBoundingClientRect();
    const hit=e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom;
    s.classList.toggle('target',hit);if(hit)over=s;
  });
  dragInfo.over=over;
}
function endDrag(e){
  if(!dragInfo)return;
  const d=dragInfo; const el=d.el;
  el.removeEventListener('pointermove',moveDrag);
  document.querySelectorAll('.slot').forEach(s=>s.classList.remove('target'));
  el.classList.remove('dragging');el.style.position='';el.style.left='';el.style.top='';el.style.width='';el.style.height='';el.style.margin='';
  if(d.over){
    const slot=d.over;
    const idx=Number(slot.dataset.index);
    if(selected[idx]){dragInfo=null;return;}
    // Only accept the correct answer for this slot; wrong parts bounce back.
    if(d.value===slot.dataset.answer){
      selected[idx]=d.value; slot.textContent=d.value; slot.classList.add('snap');
      el.classList.add('selected');el.disabled=true;
      soundSnap();
      if(selected.filter(Boolean).length===window.current.answer.length) correct();
    }else{
      soundWrong(); slot.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:220});
      document.getElementById('feedback').textContent='🤔 這個部件不是這個位置';
    }
  }
  dragInfo=null;
}

function correct(){
  const elapsed=(performance.now()-levelStart)/1000;
  state.combo++; state.maxCombo=Math.max(state.maxCombo,state.combo);
  state.coins += 10; state.done++;
  showCombo(state.combo); soundWin(); particles(34);
  document.getElementById('feedback').textContent='✨ 答對啦！  +10 🪙';
  save();
  setTimeout(()=>{
    if(daily){state.coins+=10;save();showResult('☀️ 每日挑戰完成！','獎勵 20 金幣',3,elapsed);}
    else {
      const stars=elapsed<=4 && lives===3 ? 3 : elapsed<=8 && lives>=2 ? 2 : 1;
      state.level=Math.min(state.level+1,questions.length); save();
      if(state.level>=questions.length) showResult('🏆 全部完成！','你已完成 V1.0 的 50 關',stars,elapsed);
      else showResult('關卡完成！','準備進入下一關',stars,elapsed,true);
    }
  },700);
}
function wrong(){
  lives--; state.combo=0; soundWrong();
  document.getElementById('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);
  document.getElementById('feedback').textContent='🤔 再想一下';
  if(lives<=0) setTimeout(()=>showResult('這題有點難！','答案是「'+window.current.char+'」',1,(performance.now()-levelStart)/1000),650);
}
function showCombo(n){
  if(n<2)return;
  const el=document.getElementById('comboBurst');
  el.textContent='🔥 '+n+' 連擊！';el.className='combo-burst show';
  setTimeout(()=>el.className='combo-burst',760);
}
function particles(count=30){
  const c=document.getElementById('particles'),ctx=c.getContext('2d');
  const d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0);
  const ps=[];
  for(let i=0;i<count;i++)ps.push({x:innerWidth/2+(Math.random()-.5)*100,y:innerHeight*.33,vx:(Math.random()-.5)*8,vy:-Math.random()*8-2,r:2+Math.random()*4,a:1,rot:Math.random()*6});
  let t=0;
  function frame(){ctx.clearRect(0,0,innerWidth,innerHeight);t++;
    ps.forEach(p=>{p.x+=p.vx;p.vy+=.25;p.y+=p.vy;p.a-=.018;p.rot+=.12;ctx.save();ctx.globalAlpha=Math.max(0,p.a);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=['#d97845','#d5a43a','#6e9b76','#f1c9a8'][Math.floor(Math.random()*4)];ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.7);ctx.restore()});
    if(t<65)requestAnimationFrame(frame);else ctx.clearRect(0,0,innerWidth,innerHeight);
  } frame();
}
function showHint(){
 if(state.coins>=10){state.coins-=10;save(); document.getElementById('feedback').textContent='💡 '+window.current.tip;}
 else alert('金幣不足！');
}
function showResult(title,sub,stars=3,elapsed=0,next=false){
 const starsHtml=[1,2,3].map(i=>'<span class="star '+(i<=stars?'on':'')+'">★</span>').join('');
 document.getElementById('sheet').innerHTML=
 '<div style="text-align:center"><div style="font-size:48px">🎉</div><h2>'+title+'</h2>'+
 '<div class="result-stars">'+starsHtml+'</div>'+
 '<div class="result-score"><div><b>'+elapsed.toFixed(1)+'s</b><span>完成時間</span></div><div><b>+'+state.combo+'</b><span>目前連擊</span></div><div><b>+10</b><span>金幣</span></div></div>'+
 '<div class="divider"></div><p>'+sub+'</p>'+
 (next?'<button class="primary" onclick="closeModal();loadQuestion(state.level)">下一關 →</button>':'<button class="primary" onclick="closeModal();go('home')">回首頁</button>')+
 '</div>';
 document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function renderLevels(){
 const w=document.getElementById('world');w.innerHTML='';
 questions.forEach((q,i)=>{const b=document.createElement('button');b.className='levelbtn '+(i<state.level?'done':'');b.textContent=i<state.level?'✓':i+1;b.onclick=()=>{if(i<=state.level){daily=false;lives=3;loadQuestion(i);go('game')}else alert('先完成前面的關卡喔！')};w.appendChild(b)});
}
function startDaily(){go('daily');document.getElementById('dailyChar').textContent=questions[Math.floor(new Date().getDate()%questions.length)].char;}
updateUI();
</script>
